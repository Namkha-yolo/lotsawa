name: LotsawaKeyboard
options:
  bundleIdPrefix: com.lotsawa
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: "GXMV9WJ359"
  CODE_SIGN_STYLE: Automatic

packages:
  LotsawaCore:
    path: ../LotsawaCore

targets:
  LotsawaKeyboard:
    type: application
    platform: iOS
    sources:
      - path: LotsawaKeyboard
        excludes:
          - "**/*.plist"
    info:
      path: LotsawaKeyboard/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lotsawa.keyboard
      INFOPLIST_FILE: LotsawaKeyboard/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: GXMV9WJ359
    entitlements:
      path: LotsawaKeyboard/LotsawaKeyboard.entitlements
    dependencies:
      - target: KeyboardExtension
        embed: true
      - package: LotsawaCore

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "**/*.plist"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Lotsawa
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: bo
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lotsawa.keyboard.extension
      SKIP_INSTALL: true
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: GXMV9WJ359
    entitlements:
      path: KeyboardExtension/KeyboardExtension.entitlements
    dependencies:
      - package: LotsawaCore

schemes:
  LotsawaKeyboard:
    build:
      targets:
        LotsawaKeyboard: all
        KeyboardExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
